<!DOCTYPE html>
<html lang="hi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Student Results Tracker</title>

    <!-- 🟢 1. SweetAlert2 Library Include ki gayi -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 20px;
            background: #1a202c;
            color: #fff;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            background: #2d3748;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        h2 {
            text-align: center;
            color: #63b3ed;
            margin: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            font-size: 14px;
        }

        th,
        td {
            border: 1px solid #4a5568;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #3182ce;
            color: white;
        }

        tr:nth-child(even) {
            background-color: #3a475a;
        }

        tr:hover {
            background-color: #4a5568;
        }

        .hidden {
            display: none !important;
        }

        button {
            padding: 10px 20px;
            background: #38a169;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .status-pass {
            color: #48bb78;
            font-weight: bold;
        }

        .status-fail {
            color: #f56565;
            font-weight: bold;
        }

        .swal-mobile-size {
            background: #0f172a !important;
            color: #fff !important;
        }
    </style>
</head>

<body>

    <div class="container" id="admin-main-container">
        <!-- Results Dashboard Screen -->
        <div id="dashboard-screen">
            <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #4a5568; padding-bottom: 10px;">
                <h2>📊 Student Test Results (Permanent Records)</h2>
                <button onclick="fetchResults()" style="background:#3182ce;">🔄 Refresh Data</button>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>S.No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Score</th>
                        <th>Status</th>
                        <th>Date & Time</th>
                    </tr>
                </thead>
                <tbody id="results-table">
                    <!-- Data from Firebase will appear here -->
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        // 🛡️ Gatekeeper: Check Admin Token
        const token = sessionStorage.getItem("ADMIN_AUTH_TOKEN");
        if (!token || !token.startsWith("VERIFIED_")) {
            const container = document.getElementById("admin-main-container");
            if (container) container.style.display = "none";

            Swal.fire({
                icon: 'error',
                title: 'Access Denied!',
                text: 'Please verify admin password from Dashboard first.',
                confirmButtonText: 'Go to Dashboard',
                confirmButtonColor: '#2563eb',
                allowOutsideClick: false,
                allowEscapeKey: false,
                customClass: { popup: 'swal-mobile-size' }
            }).then(() => {
                window.location.href = "dashboard.html";
            });

            throw new Error("Admin Access Denied: Redirecting to dashboard...");
        }

        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // 🟢 Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZtEP3pUWHLUMQhV-c6SnaQT4TFiOYb74",
            authDomain: "versant-mcat.firebaseapp.com",
            projectId: "versant-mcat",
            storageBucket: "versant-mcat.firebasestorage.app",
            messagingSenderId: "474002889841",
            appId: "1:474002889841:web:b1e9780aa13737fb320fd0",
            measurementId: "G-C1ML6Q9CWF"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 📊 Fetch Results from Firebase
        window.fetchResults = async function () {
            const tableBody = document.getElementById('results-table');
            tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>लोड हो रहा है...</td></tr>";

            try {
                const q = query(collection(db, "test_results"), orderBy("submittedAt", "desc"));
                const querySnapshot = await getDocs(q);

                tableBody.innerHTML = "";
                let count = 1;

                if (querySnapshot.empty) {
                    tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center;'>कोई रिजल्ट नहीं मिला।</td></tr>";
                    return;
                }

                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();

                    // Safe Date Formatting
                    let date = "N/A";
                    if (data.submittedAt) {
                        if (typeof data.submittedAt.toDate === 'function') {
                            date = data.submittedAt.toDate().toLocaleString();
                        } else {
                            const d = new Date(data.submittedAt);
                            date = isNaN(d.getTime()) ? String(data.submittedAt) : d.toLocaleString();
                        }
                    }

                    const statusClass = data.status === "PASSED" ? "status-pass" : "status-fail";

                    const row = `<tr>
                        <td>${count++}</td>
                        <td><b>${data.name || 'N/A'}</b></td>
                        <td>${data.email || 'N/A'}</td>
                        <td><b style="color:#63b3ed;">${data.score ?? 0} / 100</b></td>
                        <td class="${statusClass}">${data.status || 'N/A'}</td>
                        <td>${date}</td>
                    </tr>`;
                    tableBody.innerHTML += row;
                });
            } catch (error) {
                console.error("Data Fetch Error:", error);
                tableBody.innerHTML = "<tr><td colspan='6' style='text-align:center; color:#f56565;'>डेटा लोड करने में समस्या आई।</td></tr>";
            }
        };

        // Auto fetch on load
        fetchResults();
    </script>
    <script src="security.js"></script>

</body>

</html>
